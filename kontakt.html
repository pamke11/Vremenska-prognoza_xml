<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Kontakt | Weather Dashboard</title>
</head>
<body>
    <nav>
        <a href="index.html">Prognoza</a>
        <a href="o-projektu.html">O projektu</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>

    <div class="grid">
        <div class="card" style="grid-column: span 3;">
            <h2>Pošalji nam poruku</h2>
            <p>Imaš li prijedlog za poboljšanje ili si pronašao grešku? Piši nam!</p>
            
            <form id="kontaktForma" onsubmit="posaljiPoruku(event)">
                <input type="text" id="ime" placeholder="Tvoje Ime i Prezime" required style="margin-bottom: 10px;">
                <input type="email" id="email" placeholder="Tvoj E-mail" required style="margin-bottom: 10px;">
                <textarea id="poruka" placeholder="Tvoja poruka..." required style="width: 100%; height: 120px; background: rgba(255,255,255,0.05); border: none; border-radius: 10px; color: white; padding: 10px; margin-bottom: 10px;"></textarea>
                <button type="submit">Pošalji poruku</button>
            </form>
        </div>
    </div>

    <script>
        function posaljiPoruku(event) {
            event.preventDefault();
            alert("Hvala! Tvoja poruka je uspješno poslana.");
            document.getElementById("kontaktForma").reset();
        }
    </script>
</body>
</html>
