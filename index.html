<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Weather Dashboard</title>
</head>
<body>
    <nav>
        <a href="index.html">Prognoza</a>
        <a href="o-projektu.html">O projektu</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>

    <div class="grid">
        <div class="card">
            <h2>Pretraga</h2>
            <input type="text" id="grad" placeholder="Upiši grad...">
            <button onclick="dohvatiPrognozu()">Dohvati podatke</button>
        </div>

        <div class="card">
            <h2>Trenutni uvjeti</h2>
            <h1 id="city">Grad: --</h1>
            <p id="temp" style="font-size: 3rem;">--°C</p>
            <p id="desc">Vrijeme: --</p>
        </div>

        <div class="card">
            <h2>Statistika</h2>
            <p>Vlažnost: <span id="humidity">--</span></p>
            <p>Vjetar: <span id="wind">--</span></p>
            <p>Tlak: <span id="pressure">--</span></p>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
